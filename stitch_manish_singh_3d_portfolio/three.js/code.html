<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_3 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_3" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_3');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
camera.position.z = 6;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const purpleLight = new THREE.PointLight(0x7c3aed, 2.5, 20);
purpleLight.position.set(-3, 2, 4);
scene.add(purpleLight);

const blueLight = new THREE.PointLight(0x3b82f6, 2.5, 20);
blueLight.position.set(3, -2, 4);
scene.add(blueLight);

// 3D Halo Ring
const haloGeo = new THREE.TorusGeometry(2.1, 0.035, 16, 100);
const haloMat = new THREE.MeshPhongMaterial({
  color: 0xa855f7,
  emissive: 0x4c1d95,
  shininess: 100,
  transparent: true,
  opacity: 0.85
});
const halo = new THREE.Mesh(haloGeo, haloMat);
halo.position.set(0, 0, -0.5);
scene.add(halo);

// Secondary outer ring
const outerHaloGeo = new THREE.TorusGeometry(2.45, 0.015, 12, 100);
const outerHaloMat = new THREE.MeshPhongMaterial({
  color: 0x3b82f6,
  emissive: 0x1d4ed8,
  transparent: true,
  opacity: 0.45
});
const outerHalo = new THREE.Mesh(outerHaloGeo, outerHaloMat);
outerHalo.position.set(0, 0, -0.8);
scene.add(outerHalo);

// Floating 3D decorative objects
const floatingObjects = [];
const shapes = [
  new THREE.OctahedronGeometry(0.22, 0),
  new THREE.IcosahedronGeometry(0.18, 0),
  new THREE.TetrahedronGeometry(0.2, 0),
  new THREE.OctahedronGeometry(0.15, 0)
];

const colors = [0x7c3aed, 0x3b82f6, 0xa855f7, 0x60a5fa];
const positions = [
  [-2.8, 1.4, 0.5],
  [2.9, 1.1, -0.3],
  [-2.4, -1.5, 0.2],
  [2.6, -1.3, 0.6]
];

for (let i = 0; i < shapes.length; i++) {
  const mat = new THREE.MeshPhongMaterial({
    color: colors[i],
    emissive: colors[i],
    emissiveIntensity: 0.25,
    shininess: 80,
    wireframe: i % 2 === 1
  });
  const mesh = new THREE.Mesh(shapes[i], mat);
  mesh.position.set(positions[i][0], positions[i][1], positions[i][2]);
  mesh.userData = {
    baseY: positions[i][1],
    speed: 0.6 + i * 0.2,
    offset: i * 1.5
  };
  scene.add(mesh);
  floatingObjects.push(mesh);
}

// Mouse parallax tracking
let targetX = 0;
let targetY = 0;
const onMouseMove = (e) => {
  targetX = (e.clientX / window.innerWidth - 0.5) * 0.6;
  targetY = (e.clientY / window.innerHeight - 0.5) * 0.6;
};
window.addEventListener('mousemove', onMouseMove);

const onResize = () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
};
window.addEventListener('resize', onResize);

let animId;
const clock = new THREE.Clock();

const animate = () => {
  animId = requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Smooth camera parallax
  camera.position.x += (targetX - camera.position.x) * 0.05;
  camera.position.y += (-targetY - camera.position.y) * 0.05;
  camera.lookAt(0, 0, 0);

  // Halo rotation
  halo.rotation.z = t * 0.15;
  halo.rotation.x = Math.sin(t * 0.3) * 0.12;
  outerHalo.rotation.z = -t * 0.1;
  outerHalo.rotation.y = Math.cos(t * 0.25) * 0.15;

  // Floating objects
  floatingObjects.forEach((obj) => {
    obj.rotation.x += 0.008;
    obj.rotation.y += 0.01;
    obj.position.y = obj.userData.baseY + Math.sin(t * obj.userData.speed + obj.userData.offset) * 0.25;
  });

  renderer.render(scene, camera);
};
animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_3 -->
</body>
</html>
